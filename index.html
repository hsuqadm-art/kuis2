["#a5e6a8","#f0fbf0","#d3f4d4","#bbeebd","#5cc562","#0d2e10","#15803d","#c2410c"],
["#ffc58a","#fff5e8","#ffe0bd","#ffd09a","#f5a042","#411f00","#b45309","#6d28d9"],
["#a5cdff","#eff6ff","#d6e7ff","#bcd8ff","#6aa3f0","#0a2550","#1d4ed8","#b91c1c"],
["#cdb8ff","#f5f0ff","#e5dbff","#d6c8ff","#9d80f0","#26104d","#6d28d9","#15803d"]];
function theme(k){if(matchMedia("(prefers-color-scheme: dark)").matches)return;const r=document.documentElement.style;["--page","--card","--bg","--bg2","--line","--ink","--pri","--blue"].forEach((v,i)=>r.setProperty(v,TH[k][i]))}
function go(p){S.page=p;render();scrollTo(0,0)}
function render(){const p=S.page;theme(p<5?p:p==5?S.i%5:1);
if(p<4){const m=MAT[p];
app.innerHTML=`${p==3?'<button class="btn mulai" id="go">🚀 MULAI MENGERJAKAN!</button>':''}
<div class="mat"><div class="card"><span class="tag">${m.em} Hadis ${p+1} dari 4</span><h2>${m.t}</h2>
<div class="arab">${m.a}</div><div class="trans">${m.tr}</div><div class="src">${m.r}</div></div>
<div class="card"><div class="box ex" style="margin-top:0"><b>📖 Penjelasan:</b> ${m.e}</div>
<div class="box yes"><b>✅ Contoh sesuai:</b> ${m.y}</div>
<div class="box nope"><b>❌ Contoh tidak sesuai:</b> ${m.n}</div>
<div class="dots push">${[0,1,2,3].map(i=>`<i class="${i==p?'on':''}"></i>`).join("")}</div>
<div class="nav"><button class="btn ghost" id="pv" ${p==0?'disabled':''}>◀ Kembali</button>${p<3?'<button class="btn or" id="nx">Lanjut ▶</button>':'<span></span>'}</div></div></div>`;
$("#pv").onclick=()=>{sndClick();go(p-1)};if($("#nx"))$("#nx").onclick=()=>{sndClick();go(p+1)};if($("#go"))$("#go").onclick=()=>{sndClick();go(4)};
}else if(p==4){
app.innerHTML=`<div class="card bio"><span class="tag">📝 Biodata</span><h1>Halo, Anak Hebat! 👋</h1><p>Isi dulu namamu ya sebelum mengerjakan 20 soal.</p>
<label>Nama Lengkap</label><input id="nm" maxlength="40" placeholder="Contoh: Aisyah Putri" value="${esc(S.name)}">
<label>Kelas</label><input id="kl" maxlength="12" placeholder="Contoh: 6A" value="${esc(S.kls)}">
<div class="nav"><button class="btn ghost" id="bk">◀ Materi</button><button class="btn or" id="st">Mulai Soal ▶</button></div></div>`;
$("#bk").onclick=()=>go(3);
$("#st").onclick=()=>{const n=$("#nm").value.trim(),k=$("#kl").value.trim();if(!n||!k){alert("Isi nama lengkap dan kelas dulu ya 😊");return}S.name=n;S.kls=k;S.list=shuf(Q);S.i=0;S.ok=0;sndClick();go(5)};
}else if(p==5)quiz();else result();}

function quiz(){const q=S.list[S.i],m=MAT[q[0]];
const opts=shuf([[q[2],1],[q[3],0],[q[4],0],[q[5],0]]);S.cur={q,opts,ans:false};
app.innerHTML=`<div class="top"><span>Soal ${S.i+1}/20</span><div class="bar"><b style="width:${S.i/20*100}%"></b></div><span class="chip">👤 ${esc(S.name)} • ${esc(S.kls)}</span></div>
<div class="grid"><div class="card"><span class="tag">📜 Bacalah hadis berikut!</span>
<div class="arab s">${m.a}</div><div class="trans s">${m.tr}</div><div class="src">${m.r}</div>
<div class="q push">${S.i+1}. ${q[1]}</div></div>
<div class="card"><div id="os">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span>${"ABCD"[i]}</span>${o[0]}</button>`).join("")}</div><div id="fb" class="push"></div></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){const c=S.cur;if(c.ans)return;c.ans=true;const good=c.opts[i][1]==1;
document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(c.opts[k][1])b.classList.add("ok");else if(k==i)b.classList.add("no")});
const last=S.i==19;
if(good){S.ok++;sndOk();confetti()}else{sndNo();motiv()}
$("#fb").innerHTML=`<div class="fb ${good?'ok':'no'}"><b>${good?'🎉 Benar! Hebat sekali!':'🤗 Belum tepat, tidak apa-apa!'}</b><br>${good?'':'Jawaban benar: <b>'+c.opts.find(o=>o[1])[0]+'</b><br>'}<b>Pembahasan:</b> ${c.q[6]}</div>
<div class="nav" style="margin-top:.7rem"><span></span><button class="btn ${last?'gr':'or'}" id="nq">${last?'Lihat Skor 🏆':'Soal Berikutnya ▶'}</button></div>`;
$("#nq").onclick=()=>{sndClick();if(last){S.done=true;go(6);autoSave()}else{S.i++;render();scrollTo(0,0)}};
$("#nq").scrollIntoView({behavior:"smooth",block:"nearest"})}

const score=()=>Math.round(S.ok/20*100);
function card(){const c=document.createElement("canvas");c.width=800;c.height=1000;const x=c.getContext("2d"),sc=score();
const g=x.createLinearGradient(0,0,0,1000);g.addColorStop(0,"#fff4d6");g.addColorStop(1,"#ffe0a0");x.fillStyle=g;x.fillRect(0,0,800,1000);
x.fillStyle="#ffd58a55";for(let i=0;i<30;i++){x.beginPath();x.arc((i*173)%800,(i*97)%1000,6+(i%4)*4,0,7);x.fill()}
x.strokeStyle="#ff8a3d";x.lineWidth=14;x.beginPath();x.roundRect(30,30,740,940,50);x.stroke();
x.textAlign="center";x.fillStyle="#4a3424";x.font="700 44px Fredoka,sans-serif";x.fillText("🌟 KARTU SKOR 🌟",400,130);
x.font="500 30px Fredoka,sans-serif";x.fillStyle="#8a6f55";x.fillText("Asesmen Hadis untuk Anak",400,180);
const gg=x.createRadialGradient(400,430,20,400,430,190);gg.addColorStop(0,"#ffd93d");gg.addColorStop(1,"#ff8a3d");x.fillStyle=gg;x.beginPath();x.arc(400,430,190,0,7);x.fill();
x.fillStyle="#fff";x.font="700 150px Fredoka,sans-serif";x.fillText(sc,400,480);x.font="600 34px Fredoka,sans-serif";x.fillText("dari 100",400,540);
x.fillStyle="#4a3424";x.font="700 46px Fredoka,sans-serif";let nm=S.name;while(x.measureText(nm).width>660&&nm.length>3)nm=nm.slice(0,-2);if(nm!=S.name)nm+="…";x.fillText(nm,400,700);
x.font="500 36px Fredoka,sans-serif";x.fillText("Kelas "+S.kls,400,755);
x.fillText(`Benar ${S.ok} dari 20 soal`,400,815);
x.font="700 38px Fredoka,sans-serif";x.fillStyle="#e5533d";x.fillText(sc>=90?"Luar biasa! Pelopor Kebaikan! 🏆":sc>=70?"Hebat! Terus berbuat baik! 🎉":sc>=50?"Bagus! Ayo belajar lagi! 💪":"Semangat! Kamu pasti bisa! 📖",400,885);
x.font="400 24px Fredoka,sans-serif";x.fillStyle="#8a6f55";x.fillText(new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),400,935);return c}
const blobOf=c=>new Promise(r=>c.toBlob(r,"image/png"));
const fname=()=>"Skor-"+S.name.replace(/[^\w]+/g,"_")+".png";
async function save(){const b=await blobOf(card());try{const d=await claude.use("downloads");if(d){await d.save({filename:fname(),data:b});return}}catch(e){}
const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname();document.body.appendChild(a);a.click();a.remove()}
function autoSave(){save().catch(()=>{})}
async function share(){const sc=score(),t=`Skor Asesmen Hadis untuk Anak\n${S.name} (Kelas ${S.kls})\nNilai: ${sc}/100 🌟`;
try{const b=await blobOf(card()),f=new File([b],fname(),{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:t});return}}catch(e){if(e&&e.name=="AbortError")return}
await save().catch(()=>{});window.open("https://wa.me/?text="+encodeURIComponent(t+"\n(Kartu skor tersimpan, silakan lampirkan gambarnya)"),"_blank")}
function result(){const sc=score();app.innerHTML=`<div class="card res"><img id="im" alt="Kartu skor"><div class="sbtn"><button class="btn or" id="dl">⬇️ Unduh Kartu</button><button class="btn gr" id="wa">💬 Bagikan ke WhatsApp</button><button class="btn ghost" id="again">🔄 Ulangi dari Awal</button></div></div>`;
$("#im").src=card().toDataURL();$("#dl").onclick=save;$("#wa").onclick=share;$("#again").onclick=()=>go(4);
if(sc>=70){sndOk();confetti()}}

// keluar tab / tutup => kembali ke biodata
function reset(){S.list=[];S.i=0;S.ok=0;S.done=false;$("#mot").style.display="none";S.page=4;render()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)reset()});
addEventListener("pagehide",reset);
// layar penuh
const fsOn=()=>{const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(()=>{})};
document.addEventListener("pointerdown",fsOn,{once:true});
$("#fs").onclick=e=>{e.stopPropagation();document.fullscreenElement?document.exitFullscreen():fsOn()};
go(0);
</script></body></html>
